name: Swoop
description: >-
  Swoop (formerly Thumo) is an African super-app building toward a single
  consumer platform for everyday commerce, starting with same-day food delivery
  and online shopping in Lagos, Nigeria (Yaba, Surulere, Gbagada and surrounding
  areas) and Eswatini, where it launched in 2025 and became the country's
  largest ecommerce platform. The app offers real-time order tracking,
  transparent upfront pricing, in-app support, and payments via card, bank
  transfer and OPay, with plans to add a payments app and further services on
  the road to a pan-African super-app. Founded by Thiel Fellow Aubrey
  Niederhoffer and Edwin Ruiz, Swoop raised a $7.3M seed round in 2026 with
  participation from Version One Ventures, Long Journey, Variant, Soma Capital
  and Dune. Swoop is a consumer-facing mobile and web platform; it does not
  currently publish a public developer API, OpenAPI specification, SDKs, or
  developer documentation. This profile was surfaced as a Version One Ventures
  portfolio company and enriched as an identity-only lead.
